name: Update APK Downloads

on:
  release:
    types: [published]

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-downloads:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Calculer les téléchargements APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATA=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest")

          VERSION=$(echo "$DATA" | jq -r '.tag_name')

          COUNT=$(echo "$DATA" | jq '
            [.assets[]
            | select(.name | ascii_downcase | endswith(".apk"))
            | .download_count]
            | add // 0
          ')

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "COUNT=$COUNT" >> "$GITHUB_ENV"

          echo "Dernière release : $VERSION"
          echo "Téléchargements APK : $COUNT"

      - name: Mettre à jour le README
        run: |
          python3 <<'PY'
          import os
          import re

          path = "README.md"

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          version = os.environ["VERSION"]
          count = os.environ["COUNT"]

          content = re.sub(
              r'<!-- APK_DOWNLOADS_START -->.*?<!-- APK_DOWNLOADS_END -->',
              f'''<!-- APK_DOWNLOADS_START -->
          📥 **Téléchargements APK de la dernière release :** `{count}`

          🚀 **Dernière version :** `{version}`
          <!-- APK_DOWNLOADS_END -->''',
              content,
              flags=re.S
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          PY

      - name: Publier la mise à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "Aucune modification."
            exit 0
          fi

          git commit -m "Update APK download counter"

          git pull --rebase origin main

          git push origin main